name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    if: github.event.repository != null
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses:  actions/checkout@v4
        # with:
          # only proceed if backend files changed, 
          # handled below via paths filter instead
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run tests
        run: ./gradlew test
  frontend-tests:
    if: github.event.repository != null
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
     - uses: actions/checkout@v4
     - name: Set Up Node
       uses: actions/setup-node@v4
       with: 
        node-version: '24'
     - name: Install dependencies
       run: npm install 
     - name: Run tests
       run: npm test
  microservice-tests:
    if: github.event.repository != null
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language-model
    steps:
     - uses: actions/checkout@v4
     - name: Set Up Pytest
       uses: actions/setup-python@v4
       with:
        python-version: '3.11.15'
     - name: Install dependencies
       run: pip install fastapi pytest pytest-mock httpx pydantic python-docx pymupdf llama-index-core sentence-transformers peft transformers torch
     - name: Run tests
       run: pytest service_test.py
       env:
        MOCK_MODE: "true"
      

